services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      - BASE_URL=https://searxng.homelab.zad.bd
      - INSTANCE_NAME=Homelab SearXNG

    volumes:
      - ./searxng.yml:/etc/searxng/settings.yml
      - searxng_data:/etc/searxng

    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.searxng.rule=Host(`searxng.homelab.zad.bd`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"

      # internal port
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

      #  forwarded headers middleware
      - "traefik.http.middlewares.searxng-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.searxng-headers.headers.customrequestheaders.X-Forwarded-Port=443"

      - "traefik.http.routers.searxng.middlewares=searxng-headers"

  redis:
    image: redis:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    container_name: searxng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: searxng
      POSTGRES_USER: searxng
      POSTGRES_PASSWORD: searxng_pass
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searxng -d searxng"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  searxng_data:
  redis_data:
  postgres_data:
