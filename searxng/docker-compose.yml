services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      - BASE_URL=https://searxng.homelab.zad.bd
      - INSTANCE_NAME=Homelab SearXNG

    volumes:
      - ./searxng.yml:/etc/searxng/settings.yml
      - searxng_config:/etc/searxng

    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.searxng.rule=Host(`searxng.homelab.zad.bd`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"

      # internal port
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

      #  forwarded headers middleware
      - "traefik.http.middlewares.searxng-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.searxng-headers.headers.customrequestheaders.X-Forwarded-Port=443"

      - "traefik.http.routers.searxng.middlewares=searxng-headers"

networks:
  proxy:
    external: true

volumes:
  searxng_config: