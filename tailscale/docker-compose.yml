services:
  tailscale:
    image: tailscale/tailscale:v1.98.3
    container_name: tailscale
    hostname: docker-host
    network_mode: "host"
    privileged: true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
    command: tailscaled
    restart: unless-stopped

volumes:
  tailscale_state:
