services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3


  backend:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`chithi.dev`) && PathPrefix(`/api`)"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=api-strip"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
    environment: &backend-variable
      # Django
      SECRET_KEY: changeme-please-generate-a-long-random-secret
      DEBUG: "False"
      # Database (v0.2.0: single DATABASE_URL replaces POSTGRES_* vars)
      DATABASE_URL: postgres://postgres:supersecretpassword@postgres:5432/chithi
      # Backblaze B2 (S3-compatible API). See .env for the secret values.
      # S3_ENDPOINT_URL = B2 S3 API endpoint (where the backend writes).
      # S3_CDN_URL      = public/CDN domain clients download from (free B2 egress
      #                   via Cloudflare Bandwidth Alliance). When set, downloads
      #                   skip query-string signing.
      STORAGE_BACKEND: b2
      S3_ENDPOINT_URL: https://s3.eu-central-003.backblazeb2.com
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ADDRESSING_STYLE: path
      S3_CDN_URL: ${S3_CDN_URL:-https://media.chithi.dev}
      # Celery / Redis (v0.2.0: REDIS_ENDPOINT removed — broker URL doubles as cache + channel layer)
      CELERY_BROKER_URL: redis://redis:6379/0
      # Running behind reverse proxy
      ROOT_PATH: /api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - default

  celery:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: celery
    restart: unless-stopped
    environment: *backend-variable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: ghcr.io/chithi-dev/chithi-frontend-node:latest
    container_name: frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`chithi.dev`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Embedder-Policy=require-corp"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.routers.frontend.middlewares=coep@docker"

    environment:
      PUBLIC_BACKEND_API: https://chithi.dev/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy

volumes:
  postgres_data:
  redis_data:

networks:
  proxy:
    external: true
