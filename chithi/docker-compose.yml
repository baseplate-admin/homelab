version: "3.9"

services:

  # -------------------------
  # Database
  # -------------------------
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -----------
  # RustFS init 
  # ------------
  rustfs-init:
    image: busybox:latest
    command: ["sh", "-c", "mkdir -p /data/rustfs && chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    user: root
    restart: "no"


  # -------------------------
  # RustFS Object Storage
  # -------------------------
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.84
    container_name: rustfs
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: "/data/rustfs"
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:8.6.1-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # -------------------------
  # RabbitMQ
  # -------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # -------------------------
  # Backend API
  # -------------------------
  backend:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: backend
    restart: unless-stopped
    command: /bin/sh /app/scripts/start_backend.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`chithi.dev`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=api-strip"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.docker.network=proxy"
    environment: &backend-env
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      CELERY_BROKER_URL: amqp://rabbit:rabbitpass@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_ENDPOINT: redis://redis:6379/1
      ROOT_PATH: /api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - proxy
      - default


  # -------------------------
  # Celery Worker
  # -------------------------
  celery:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: celery
    restart: unless-stopped
    command: /bin/sh /app/scripts/start_celery.sh
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy


  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    image: ghcr.io/chithi-dev/chithi-frontend-node:latest
    container_name: frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`chithi.dev`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    environment:
      PUBLIC_BACKEND_API: https://chithi.dev/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy


# -------------------------
# Volumes
# -------------------------
volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  rabbitmq_data:


# -------------------------
# Networks
# -------------------------
networks:
  proxy:
    external: true
