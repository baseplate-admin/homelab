services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.80
    security_opt:
      - "no-new-privileges:true"
    container_name: rustfs
    restart: unless-stopped
    user: "10001:10001" 
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs:/data
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: "/data/rustfs{0..3}"
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
  redis:
    image: redis:8.4.0-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/chithi-dev/chithi-backend:0.0.1
    container_name: backend
    restart: unless-stopped
    command: /bin/sh /app/scripts/start_backend.sh
    environment: &backend-variable
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  celery_worker:
    image:  ghcr.io/chithi-dev/chithi-backend:0.0.1
    container_name: celery_worker
    restart: unless-stopped
    command: /bin/sh /app/scripts/start_celery.sh
    environment: *backend-variable
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_started
  caddy:
    image:  ghcr.io/chithi-dev/chithi-caddy:0.0.1
    container_name: caddy-proxy
    restart: unless-stopped
    environment:
      DOMAIN: :80
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    image: ghcr.io/chithi-dev/chithi-frontend:0.0.1
    container_name: frontend
    restart: unless-stopped
    environment:
      PUBLIC_BACKEND_API: https://chithi.dev/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  rustfs:
