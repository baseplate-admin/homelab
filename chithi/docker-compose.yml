services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: chithi
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.3
    security_opt:
      - "no-new-privileges:true"
    container_name: rustfs
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - rustfs:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin # CHANGEME
      - RUSTFS_SECRET_KEY=rustfsadmin # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      # - RUSTFS_TLS_PATH=/opt/tls
      # Object Cache
      - RUSTFS_OBJECT_CACHE_ENABLE=true
      - RUSTFS_OBJECT_CACHE_TTL_SECS=300


    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully

  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3


  backend:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: backend
    restart: unless-stopped
    # v0.2.0: backend is now Django + Channels (ASGI). The old start_backend.sh
    # (uvicorn app.main:app + alembic) was removed; we ship our own scripts/
    # that run migrations (`manage.py migrate`) then serve the ASGI app.
    # If this 404s / fails on first boot, the image's entrypoint changed.
    volumes:
      - ./scripts:/app/scripts:ro
    command: /bin/sh /app/scripts/start_backend.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`chithi.dev`) && PathPrefix(`/api`)"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=api-strip"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
    environment: &backend-variable
      # Django
      SECRET_KEY: changeme-please-generate-a-long-random-secret
      DEBUG: "False"
      # Database (v0.2.0: single DATABASE_URL replaces POSTGRES_* vars)
      DATABASE_URL: postgres://postgres:supersecretpassword@postgres:5432/chithi
      # S3-compatible object storage (v0.2.0: RUSTFS_* -> S3_*, map RustFS to the s3 backend)
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_BUCKET_NAME: chithi
      # Celery / Redis (v0.2.0: REDIS_ENDPOINT removed — broker URL doubles as cache + channel layer)
      CELERY_BROKER_URL: redis://redis:6379/0
      # Running behind reverse proxy
      ROOT_PATH: /api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - proxy
      - default

  celery:
    image: ghcr.io/chithi-dev/chithi-backend:latest
    container_name: celery
    restart: unless-stopped
    # v0.2.0: Celery app now lives in the `core` package (was `app.celery`).
    volumes:
      - ./scripts:/app/scripts:ro
    command: /bin/sh /app/scripts/start_celery.sh
    environment: *backend-variable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: ghcr.io/chithi-dev/chithi-frontend-node:latest
    container_name: frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`chithi.dev`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Embedder-Policy=require-corp"
      - "traefik.http.middlewares.coep.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.routers.frontend.middlewares=coep@docker"

    environment:
      PUBLIC_BACKEND_API: https://chithi.dev/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy

volumes:
  postgres_data:
  redis_data:
  rustfs:

networks:
  proxy:
    external: true
