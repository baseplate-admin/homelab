services:
  miner:
    image: miningcontainers/xmrig:latest
    container_name: unmineable-cpu
    restart: unless-stopped

    cpuset: "0"
    cpus: 1.0

    command:
      - --algo=rx/0
      - --url=rx.unmineable.com:3333
      - --user=zarif_ahnaf.core2duo
      - --pass=x
      - --keepalive
      - --threads=1
      - --cpu-priority=1
      - --randomx-init=1
      - --randomx-mode=light
      - --print-time=60

    security_opt:
      - no-new-privileges:true
