services:
  miner:
    image: miningcontainers/xmrig:latest
    container_name: unmineable-cpu
    restart: unless-stopped

    cpus: 0.10

    command:
      - --algo=rx/0
      - --url=xmr.kryptex.network:7029
      - --user=krxYD3N2K4.worker
      - --pass=x
      - --threads=1
      - --cpu-priority=1
      - --randomx-mode=light
      - --print-time=60

    security_opt:
      - no-new-privileges:true