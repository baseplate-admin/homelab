services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MODELS=/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/models
    networks:
      - ai-net

  mongodb:
    image: mongo:4.4.18
    container_name: librechat-db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-net

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/librechat
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - NODE_ENV=production
    volumes:
      - librechat_data:/app/client/public/images
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librechat.rule=Host(`ai.homelab.zad.bd`)"
      - "traefik.http.routers.librechat.entrypoints=websecure"
      - "traefik.http.routers.librechat.tls=true"
      - "traefik.http.routers.librechat.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat.loadbalancer.server.port=3080"
    networks:
      - proxy
      - ai-net
    depends_on:
      - ollama
      - mongodb

volumes:
  ollama_models:
  mongo_data:
  librechat_data:

networks:
  proxy:
    external: true
  ai-net:
    driver: bridge
