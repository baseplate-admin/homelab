services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MODELS=/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/models
    ports:
      - "11434:11434"
    networks:
      - ai-net

  onyx:
    image: onyx/onyx:latest
    container_name: onyx
    restart: unless-stopped

    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - NODE_ENV=production

      - OLLAMA_BASE_URL=http://ollama:11434

      - ALLOW_REGISTRATION=true

    volumes:
      - onyx_data:/app/data

    depends_on:
      - ollama

    networks:
      - proxy
      - ai-net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.onyx.rule=Host(`ai.homelab.zad.bd`)"
      - "traefik.http.routers.onyx.entrypoints=websecure"
      - "traefik.http.routers.onyx.tls=true"
      - "traefik.http.routers.onyx.tls.certresolver=letsencrypt"

      - "traefik.http.services.onyx.loadbalancer.server.port=3080"

volumes:
  ollama_models:
  onyx_data:

networks:
  proxy:
    external: true
  ai-net:
    driver: bridge
