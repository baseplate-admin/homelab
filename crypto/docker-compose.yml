
services:
  miner:
    build: .
    container_name: unmineable-gtx1050ti
    restart: unless-stopped

    gpus: all

    command:
      - --algo
      - pearl
      - --pool
      - stratum+tcp://pearlpow.unmineable.com:3333
      - --wallet
      - zarif_ahnaf.gtx1050ti

    security_opt:
      - no-new-privileges:true
